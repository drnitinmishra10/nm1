const searchEl=document.getElementById("search"), filterEl=document.getElementById("columnFilter");
const tabsEl=document.getElementById("tabs"), thead=document.getElementById("thead"), tbody=document.getElementById("tbody");
const titleEl=document.getElementById("datasetTitle"), countEl=document.getElementById("count");
function makeTabs(){tabsEl.innerHTML="";order.forEach(key=>{const b=document.createElement("button");b.className="tab"+(key===active?" active":"");b.textContent=DIRECTORY[key].title;b.onclick=()=>{active=key;searchEl.value="";filterEl.value="";render();makeTabs()};tabsEl.appendChild(b)})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cellHtml(value, col){
 let s=String(value??"").trim(); if(!s)return "";
 // Linkify email addresses and phone-number-like values while preserving all other text.
 if(col.toLowerCase().includes("email") && /^[^@\s]+@[^@\s]+\.[^@\s,;]+$/.test(s)) return `<a href="mailto:${esc(s)}">${esc(s)}</a>`;
 if((col.toLowerCase().includes("mobile")||col.toLowerCase().includes("contact no")||col.toLowerCase().includes("extension")||col.toLowerCase().includes("ext")) && /^[+\d][\d\s()+,;/.-]*$/.test(s) && /\d{4,}/.test(s)){
   const digits=s.replace(/[^\d+]/g,""); return `<a href="tel:${esc(digits)}">${esc(s)}</a>`;
 }
 return esc(s).replace(/\n/g,"<br>");
}
function render(){

 const rows=ds.rows.filter(r=>{
   const vals=useCol?[r[useCol]]:ds.columns.map(c=>r[c]);
   return !q||vals.some(v=>String(v??"").toLowerCase().includes(q));
 });
